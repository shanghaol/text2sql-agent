# sql.shanghl.club 宝塔 nginx 站点配置（W4 §5.6 原生共存形态）
# 放置位置（服务器）：/www/server/panel/vhost/nginx/sql.shanghl.club.conf
# 证书：certbot webroot 签发（deploy.sh 阶段②自动完成），续期由 certbot systemd timer 自动
# 重载：nginx -s reload（或宝塔面板重载 nginx）
#
# ── HTTP：ACME 验证 + 301 跳 HTTPS ──
server {
    listen 80;
    server_name sql.shanghl.club;
    location /.well-known/acme-challenge/ {
        root /www/text2sql/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：前端静态 + /api 反代（SSE 关键：proxy_buffering off）──
server {
    listen 443 ssl;
    server_name sql.shanghl.club;

    ssl_certificate     /etc/letsencrypt/live/sql.shanghl.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sql.shanghl.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 前端 dist 静态托管
    root /www/text2sql/ui;
    index index.html;
    location / {
        try_files $uri /index.html;   # history 路由回退
    }

    # /api → Java 网关（8081）；SSE 必须禁缓冲，逐事件到达浏览器
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # SSE 关键（等价 Caddy flush_interval -1）
        proxy_cache off;
        proxy_read_timeout 300s;      # SSE 静默数十秒不掐
        proxy_set_header Connection "";
    }
}
